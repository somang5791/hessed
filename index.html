:root{--ink:#1a1a2e;--ink-mid:#3d3d5c;--ink-soft:#7b7b9a;--paper:#f7f6f2;--paper2:#eeecea;--rule:#d8d5cf;--gold:#b8860b;--gold-lt:#f5ecc8;--red:#c0392b;--green:#1a6b3c;--blue:#1a3a6b;--blue-lt:#e8eef8;--shadow:0 2px 12px rgba(26,26,46,.08);--shadow-md:0 4px 24px rgba(26,26,46,.13);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6}
header{background:var(--ink);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow-md)}
.hbrand{display:flex;align-items:center;gap:8px;min-width:0}.hbrand img{width:34px;height:34px;border-radius:7px;background:#fff;padding:2px;flex-shrink:0}.hbrand h1{letter-spacing:.12em}
.hbrand h1{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;align-items:center;gap:8px;font-size:12px}
.who{background:rgba(255,255,255,.12);padding:3px 10px;border-radius:20px;white-space:nowrap}
.year-nav{background:var(--blue);color:#fff;padding:6px 16px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;position:sticky;top:56px;z-index:195}
.year-nav select{padding:3px 6px;border-radius:4px;border:none;font-weight:700}
.lockbadge{background:var(--gold);color:var(--ink);font-size:11px;padding:1px 8px;border-radius:10px}
nav.tabs{background:#fff;border-bottom:2px solid var(--rule);padding:0 8px;display:flex;overflow-x:auto;position:sticky;top:100px;z-index:190;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tbtn{padding:10px 14px;font-size:12px;font-weight:500;color:var(--ink-soft);background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-2px;font-family:inherit}
.tbtn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 6px;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-head{padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-head h3{font-size:13px;font-weight:700;color:var(--ink-mid)}.card-body{padding:18px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:5px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{opacity:.85}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff}.btn-gold{background:var(--gold);color:var(--ink)}.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:var(--paper2);color:var(--ink-mid);border:1px solid var(--rule)}.btn-green{background:var(--green);color:#fff}.btn-sm{padding:3px 9px;font-size:12px}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-mid);margin-bottom:3px}
.field input,.field select,.field textarea,.inp{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue)}
.req{color:var(--red)}.hint{font-size:11px;color:var(--blue);margin-top:2px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:var(--paper);border-bottom:2px solid var(--rule);padding:9px 10px;font-size:12px;font-weight:700;color:var(--ink-mid);text-align:left;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--paper2);padding:8px 10px;font-size:13px;vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}.tbl .ctr{text-align:center}
.tbl tr.sum td{background:var(--gold-lt);font-weight:700}
.st{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.st-requested{background:#fff3cd;color:#8a6d00}.st-approved{background:var(--blue-lt);color:var(--blue)}.st-paid{background:#d9f0e2;color:var(--green)}.st-rejected{background:#f8d7da;color:var(--red)}
.neg{color:var(--red);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters select,.filters input{padding:5px 8px;border:1px solid var(--rule);border-radius:5px;font-size:12px;font-family:inherit}
.note{font-size:12px;color:var(--ink-soft);margin:6px 0}
.empty{padding:30px;text-align:center;color:var(--ink-soft)}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{padding:6px 14px;border-radius:20px;border:1px solid var(--rule);background:#fff;font-size:12px;cursor:pointer;font-family:inherit}
.subtabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
#login{max-width:340px;margin:80px auto;padding:0 16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;display:none;max-width:90vw}
#toast.err{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin-bottom:12px;font-size:15px}.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.scopegrid{border-collapse:collapse}.scopegrid th,.scopegrid td{border:1px solid var(--rule);padding:8px 14px;text-align:center;font-size:13px}.scopegrid th{background:var(--paper)}
.scopegrid input{width:18px;height:18px}
.slotrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.preview{display:flex;border:1px solid #000;width:max-content;margin:8px 0}.preview div{border-right:1px solid #000;min-width:70px;text-align:center;font-size:12px}.preview div:last-child{border-right:none}.preview b{display:block;background:#eee;border-bottom:1px solid #000;padding:2px 6px}.preview span{display:block;height:44px;padding-top:12px;color:#888}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.hright .who{display:none}}
</style>
</head>

  const fillC=()=>{const d=+$('#rd').value;const cs=[...new Set(cb.filter(x=>x.dept_id===d).map(x=>x.category_id))];$('#rc').innerHTML=cs.map(c=>`<option value="${c}">${esc(cn(c))}</option>`).join('');fillI()};

  $('#rd').onchange=()=>{fillC();bal()};$('#rc').onchange=()=>{fillI();bal()};$('#ra').oninput=bal;fillC();bal();
  try{const m=JSON.parse(localStorage.getItem('sh_payee')||'null');if(m){$('#ph').value=m.h||'';$('#pb').value=m.b||'';$('#pa').value=m.a||''}}catch(_){}

function compress(file,max=1280,q=.75){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('압축 실패')),'image/jpeg',q)};
  img.onerror=()=>rej(new Error('이미지를 읽을 수 없습니다. JPG/PNG 사진을 선택하세요.'));img.src=u})}
async function submitReq(){
  const btn=$('#reqBtn'),f=$('#rf').files[0],amt=+$('#ra').value,desc=$('#rdesc').value.trim(),ph=$('#ph').value.trim(),pb=$('#pb').value.trim(),pa=$('#pa').value.trim();

  if(!ph||!pb||!pa)return toast('입금받을 예금주·은행·계좌번호를 입력하세요.',true);
  btn.disabled=true;btn.textContent='올리는 중…';
  try{
    const blob=await compress(f);const path=`${S.me.user_id}/${S.idem}.jpg`;
    const up=await sb.storage.from('receipts').upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(up.error&&!/exists|Duplicate/i.test(up.error.message))throw up.error;
    await rpc('submit_expense',{p_year:S.year,p_dept:+$('#rd').value,p_cat:+$('#rc').value,p_item:$('#ri').value?+$('#ri').value:null,p_amount:amt,p_description:desc,p_note:$('#rn').value.trim()||null,p_date:$('#rdt').value,p_receipt_path:path,p_payee_holder:ph,p_payee_bank:pb,p_payee_account:pa,p_idem:S.idem});

async function act(a,id){
  const e=S.expenses.find(x=>x.id===+id);
  try{
    if(a==='receipt'){const {data,error}=await sb.storage.from('receipts').createSignedUrl(e.receipt_path,300);if(error)return toast('영수증을 볼 권한이 없거나 파일이 없습니다.',true);return window.open(data.signedUrl,'_blank')}
    if(a==='print')return printExpense(e);
    if(a==='edit')return editModal(e);
    if(a==='approve'){await rpc('approve_expense',{p_id:e.id});toast('승인했습니다.')}
    if(a==='reject'){const r=prompt('반려 사유를 입력하세요.');if(!r)return;await rpc('reject_expense',{p_id:e.id,p_reason:r});toast('반려했습니다.')}

    if(a==='del'){if(!confirm('삭제(휴지통 이동)할까요?'))return;await rpc('admin_delete_expense',{p_id:e.id});toast('휴지통으로 이동했습니다.')}
    if(a==='restore'){await rpc('admin_restore_expense',{p_id:e.id});toast('복구했습니다.')}
    await loadYear();renderTabs();render();
  }catch(_){}
}

    $('#appreview').innerHTML=S.apRows.length?`<div class="preview">${S.apRows.map(r=>`<div><b>${esc(r.label||'　')}</b><span>${esc(r.signer)}</span></div>`).join('')}</div>`:'<p class="note">결재란 없음 (인쇄물에 결재란이 나오지 않습니다)</p>'};
  $('#subbody').innerHTML=`<div class="card"><div class="card-head"><h3>결재란 설정</h3></div><div class="card-body">
  <div class="field" style="max-width:260px"><label>문서 종류</label><select id="apd">${Object.entries(DOCS).map(([k,v])=>`<option value="${k}" ${S.apDoc===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <p class="note">인쇄물 오른쪽 위에 표시됩니다. 최대 6칸.</p><div id="aprows"></div>
  <div style="margin:8px 0"><button class="btn btn-ghost btn-sm" id="apadd">+ 칸 추가</button></div><div id="appreview"></div>
  <button class="btn btn-primary" id="apsave">저장</button></div></div>`;
  S.apPaint=paint;draw();
  $('#apd').onchange=e=>{S.apDoc=e.target.value;draw()};
  $('#apadd').onclick=()=>{if(S.apRows.length>=6)return toast('최대 6칸입니다.',true);S.apRows.push({label:'',signer:''});paint()};
  $('#aprows').oninput=e=>{const i=e.target.dataset.i;if(i!=null){S.apRows[+i][e.target.dataset.k]=e.target.value;$('#appreview').innerHTML=S.apRows.length?`<div class="preview">${S.apRows.map(r=>`<div><b>${esc(r.label||'　')}</b><span>${esc(r.signer)}</span></div>`).join('')}</div>`:''}};
  $('#apsave').onclick=async()=>{try{await rpc('set_approval_line',{p_doc:S.apDoc,p_slots:S.apRows});toast('저장했습니다.');await loadStatic();draw()}catch(_){}};
}
function setYear(){
  $('#subbody').innerHTML=`<div class="card"><div class="card-head"><h3>회계연도 마감</h3></div><div class="card-body"><p class="note">마감하면 관리자 외에는 해당 연도의 신청·승인·입금·차용을 처리할 수 없습니다.</p>
  <table class="tbl"><tbody>${S.years.map(y=>`<tr><td><b>${y.year}년</b></td><td>${y.locked?'🔒 마감':'진행 중'}</td><td><button class="btn btn-ghost btn-sm" data-act="lock" data-id="${y.year}">${y.locked?'마감 해제':'마감하기'}</button></td></tr>`).join('')}</tbody></table></div></div>`;
}


/* ───── 입금관리 (회계·관리자) ───── */
const DAY=86400000;
function payDays(g){return Math.floor((Date.now()-new Date(g.oldest).getTime())/DAY)}
function usableAccts(){return S.accts.filter(a=>a.active&&(isAdmin()||a.owner_user_id===S.me.user_id))}
function payPopup(){
  const tot=S.pay.reduce((s,g)=>s+ +g.total,0),late=S.pay.filter(g=>payDays(g)>=7);
  const m=modal(`<h3>💸 입금 대기 ${S.pay.length}개 계좌 · 총 ${won(tot)}원</h3>
  ${late.length?`<div style="background:#f8d7da;color:var(--red);padding:8px 10px;border-radius:6px;font-weight:700;margin-bottom:10px">⚠ 신청 후 7일이 지나도 입금되지 않은 건이 ${late.length}개 계좌에 있습니다. 서둘러 처리해 주세요.</div>`:''}
  <div class="tblwrap"><table class="tbl"><thead><tr><th>예금주</th><th>은행 / 계좌번호</th><th class="num">건수</th><th class="num">금액</th><th>경과</th></tr></thead><tbody>
  ${S.pay.map(g=>`<tr><td>${esc(g.account_holder)}</td><td>${esc(g.bank_name)} ${esc(g.account_no)}</td><td class="num">${g.cnt}</td><td class="num">${won(g.total)}</td><td class="${payDays(g)>=7?'neg':''}">${payDays(g)}일</td></tr>`).join('')}</tbody></table></div>
  <p class="note">완료하기 전까지 로그인할 때마다 이 알림이 표시됩니다.</p>
  <div class="actions"><button class="btn btn-ghost" id="pp-close">나중에</button><button class="btn btn-primary" id="pp-go">확인하고 입금관리로 이동</button></div>`);
  m.querySelector('#pp-close').onclick=()=>m.remove();
  m.querySelector('#pp-go').onclick=()=>{m.remove();S.tab='pay';renderTabs();render()};
}
function renderPay(){
  const ua=usableAccts();if(!S.pickAcct||!ua.some(a=>a.id===S.pickAcct))S.pickAcct=ua[0]?.id||null;
  const ex=id=>S.expenses.find(e=>e.id===id);
  const tot=S.pay.reduce((s,g)=>s+ +g.total,0);
  const balOf=id=>S.bal.find(b=>b.account_id===id)?.balance??0;
  const ed=S.acctEdit?S.accts.find(a=>a.id===S.acctEdit):null;
  $('#main').innerHTML=`
  <div class="card"><div class="card-head"><h3>입금 대기 (${S.pay.length}개 계좌 · ${won(tot)}원)</h3>
    <div class="filters"><label style="font-size:12px">출금 계좌</label><select id="pacct">${ua.map(a=>`<option value="${a.id}" ${a.id===S.pickAcct?'selected':''}>${esc(a.label)} (${esc(a.bank_name)} ${esc(a.account_no)}) · 잔액 ${won(balOf(a.id))}원</option>`).join('')||'<option value="">등록된 계좌 없음</option>'}</select>
    <button class="btn btn-green btn-sm" data-act="pall" ${S.pay.length&&S.pickAcct?'':'disabled'}>전체 입금완료</button></div></div>
  ${S.pay.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>예금주</th><th>은행 / 계좌번호</th><th class="num">건수</th><th class="num">금액</th><th>내역</th><th>경과</th><th></th></tr></thead><tbody>
  ${S.pay.map((g,i)=>`<tr><td><b>${esc(g.account_holder)}</b></td><td>${esc(g.bank_name)} ${esc(g.account_no)} <button class="btn btn-ghost btn-sm" data-act="pcopy" data-i="${i}">복사</button></td><td class="num">${g.cnt}</td><td class="num"><b>${won(g.total)}</b></td>
  <td style="font-size:12px">${g.expense_ids.map(id=>{const e=ex(id);return e?`${esc(dn(e.dept_id))}·${esc(cn(e.category_id))} ${esc(e.description)} ${won(e.amount)}원`:'#'+id}).join('<br>')}</td>
  <td class="${payDays(g)>=7?'neg':''}">${payDays(g)}일${payDays(g)>=7?' ⚠':''}</td><td><button class="btn btn-gold btn-sm" data-act="pgroup" data-i="${i}" ${S.pickAcct?'':'disabled'}>입금완료</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">입금 대기 중인 건이 없습니다. 👍</div>'}
  <div class="card-body"><p class="note">계좌로 직접 입금한 뒤 [입금완료]를 누르면 선택한 출금 계좌의 출금 내역에 자동으로 기록되고, 지출 상태가 입금완료로 바뀝니다. 승인 단계는 따로 거치지 않아도 됩니다.</p></div></div>
  <div class="card"><div class="card-head"><h3>내 계좌 관리${isAdmin()?' (관리자: 전체)':''}</h3></div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>구분</th><th>이름</th><th>은행 / 계좌번호</th><th>예금주</th><th class="num">잔액</th><th></th></tr></thead><tbody>
  ${S.accts.filter(a=>isAdmin()||a.owner_user_id===S.me.user_id).map(a=>`<tr><td>${a.kind==='main'?'총괄':'개인'}${a.active?'':' (사용중지)'}</td><td>${esc(a.label)}</td><td>${esc(a.bank_name)} ${esc(a.account_no)}</td><td>${esc(a.holder)}</td><td class="num">${won(balOf(a.id))}</td><td>${a.kind==='main'&&!isAdmin()?'':`<button class="btn btn-ghost btn-sm" data-act="acctedit" data-id="${a.id}">수정</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">등록된 계좌가 없습니다. 아래에서 사용할 계좌를 등록하세요.</td></tr>'}</tbody></table></div>
  <div class="card-body"><b style="font-size:12px">${ed?'계좌 수정':'계좌 등록'}</b>
  <div class="grid2" style="margin-top:8px"><div class="field"><label>이름(구분용)</label><input id="al" value="${esc(ed?.label||'')}" placeholder="예: 1청 회계 계좌"></div><div class="field"><label>은행</label><input id="ab" value="${esc(ed?.bank_name||'')}"></div></div>
  <div class="grid2"><div class="field"><label>계좌번호</label><input id="an" value="${esc(ed?.account_no||'')}" inputmode="numeric"></div><div class="field"><label>예금주</label><input id="ah" value="${esc(ed?.holder||'')}"></div></div>
  <button class="btn btn-primary btn-sm" data-act="acctsave">${ed?'수정 저장':'등록'}</button>${ed?' <button class="btn btn-ghost btn-sm" data-act="acctcancel">취소</button>':''}</div></div>`;
  const pa=$('#pacct');if(pa)pa.onchange=e=>{S.pickAcct=+e.target.value||null};
}
async function payAct(a,i){
  try{
    if(a==='pcopy'){const g=S.pay[+i];try{await navigator.clipboard.writeText(g.account_no);toast('계좌번호를 복사했습니다.')}catch(_){toast(g.account_no)}return}
    if(a==='pgroup'||a==='pall'){
      const groups=a==='pall'?S.pay:[S.pay[+i]],ids=groups.flatMap(g=>g.expense_ids),sum=groups.reduce((s,g)=>s+ +g.total,0);
      const acct=S.accts.find(x=>x.id===S.pickAcct);if(!acct)return toast('출금 계좌를 선택하세요.',true);
      if(!confirm(`${groups.length}개 계좌 · ${ids.length}건 · 총 ${won(sum)}원을\n[${acct.label}]에서 입금 완료로 처리할까요?\n(실제 이체를 마친 뒤에 눌러 주세요)`))return;
      const n=await rpc('pay_expenses',{p_ids:ids,p_account:acct.id});toast(`${n}건 입금완료 처리했습니다.`);
    }
    if(a==='acctsave'){const ed=S.acctEdit;await rpc('save_account',{p_id:ed||null,p_label:$('#al').value,p_bank:$('#ab').value,p_no:$('#an').value,p_holder:$('#ah').value});S.acctEdit=null;toast('저장했습니다.')}
    if(a==='acctedit'){S.acctEdit=+i;return renderPay()}
    if(a==='acctcancel'){S.acctEdit=null;return renderPay()}
    await loadStatic();await loadYear();renderTabs();render();
  }catch(_){}
}

/* ───── 이벤트 ───── */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-tab],[data-sub],[data-act]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;renderTabs();return render()}
  if(t.dataset.sub){S.sub=t.dataset.sub;return renderSet()}
  const a=t.dataset.act,id=t.dataset.id;
  if(['pcopy','pgroup','pall','acctsave','acctedit','acctcancel'].includes(a))return payAct(a,t.dataset.i??id);
  if(['catadd','catren','cattog','itadd','itedit','itdel'].includes(a))return setAct(a,id);
  if(a==='aprm'){S.apRows.splice(+id,1);return S.apPaint()}
  if(a==='lock'){const y=S.years.find(v=>v.year===+id);try{await rpc('set_year_lock',{p_year:y.year,p_locked:!y.locked});await loadStatic();await loadYear();renderTabs();renderSet()}catch(_){}return}
  if(a==='bok'||a==='bno'){try{await rpc('decide_borrow',{p_id:+id,p_approve:a==='bok'});toast(a==='bok'?'승인했습니다.':'거절했습니다.');await loadYear();renderTabs();render()}catch(_){}return}
  act(a,id);
});
document.addEventListener('click',ev=>{if(ev.target.id==='reqBtn')submitReq()});
$('#loginBtn').onclick=login;$('#lpw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();S.me=null;$('#app').style.display='none';$('#login').style.display='block';$('#lpw').value=''};
$('#refreshBtn').onclick=async()=>{await reload();toast('새로고침했습니다.')};
$('#yearSel').onchange=async e=>{S.year=+e.target.value;await loadYear();renderTabs();render()};
boot();
</script>
</body>
</html>
