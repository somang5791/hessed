<style>
:root{--ink:#1a1a2e;--ink-mid:#3d3d5c;--ink-soft:#7b7b9a;--paper:#f7f6f2;--paper2:#eeecea;--rule:#d8d5cf;--gold:#b8860b;--gold-lt:#f5ecc8;--red:#c0392b;--green:#1a6b3c;--blue:#1a3a6b;--blue-lt:#e8eef8;--shadow:0 2px 12px rgba(26,26,46,.08);--shadow-md:0 4px 24px rgba(26,26,46,.13);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6}
header{background:#fff;color:var(--ink);border-bottom:1px solid var(--rule);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow)}
.hbrand{display:flex;align-items:center;gap:8px;min-width:0}.hbrand img{width:36px;height:36px;flex-shrink:0}.hbrand h1{letter-spacing:.12em}
.hbrand img,.hbrand h1{cursor:pointer}
.hbrand h1{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmopt{display:block;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;cursor:pointer;margin:0}.pmopt:has(input:checked){border-color:var(--blue);background:#eef3fb}.pmopt .note{margin:2px 0 0 20px}
.hyear{font-size:16.66px;font-weight:900;color:var(--blue);line-height:1.2;white-space:nowrap;flex-shrink:0;border:none;background:transparent;font-family:inherit;cursor:pointer;padding:2px 0;outline:none}
.hyear:hover,.hyear:focus{background:var(--paper2);border-radius:4px}
@media(max-width:480px){header{padding:0 8px}.hright{gap:4px}.hbrand{gap:4px}.hbrand img{width:30px;height:30px}.hbrand h1{letter-spacing:.02em}.hright .btn{padding:4px 8px}.lktxt{display:none}.lockbadge{padding:1px 4px}}
.hright{display:flex;align-items:center;gap:8px;font-size:12px}
.hylab{font-size:12px;font-weight:700;color:var(--muted,#666);white-space:nowrap;flex-shrink:0;margin-left:6px;cursor:pointer}
.homelink{display:flex;align-items:center;gap:5px;color:var(--ink);text-decoration:none;font-weight:700;white-space:nowrap;padding:3px 6px;border-radius:6px}.homelink:hover{background:var(--paper2)}.homelink img{width:26px;height:26px}
.abar{padding:10px 16px;font-size:13px;line-height:1.5;border-bottom:1px solid rgba(0,0,0,.06)}.abar .abtn{margin-left:6px;background:#fff;border:1px solid currentColor;color:inherit}
.abar-blue{background:#e8f1fb;color:#1f4e8c}.abar-orange{background:#fff1e0;color:#a85400;font-size:14px}.abar-red{background:#fde8e6;color:#b42318;font-size:15px;font-weight:600}
@media(max-width:640px){.homelink span{display:none}.hyt{display:none}.hylab{margin-left:2px}}
@media(max-width:480px){.hbrand h1{display:none}}
.who{background:var(--paper2);color:var(--ink-mid);font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.lockbadge{background:var(--gold);color:var(--ink);font-size:11px;padding:1px 8px;border-radius:10px}
nav.tabs{background:var(--blue);border-bottom:none;padding:0 8px;display:flex;overflow-x:auto;position:sticky;top:56px;z-index:190;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.subnav{background:var(--paper);border-bottom:1px solid var(--rule);padding:8px 12px;display:flex;gap:6px;overflow-x:auto;position:sticky;top:97px;z-index:185;scrollbar-width:none}
.subnav button{padding:5px 14px;border-radius:20px;border:1px solid var(--rule);background:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.subnav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tbtn{padding:11px 11px;font-size:13px;font-weight:600;color:rgba(255,255,255,.72);background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-2px;font-family:inherit}
.tbtn.active{color:#fff;border-bottom-color:#fff;font-weight:800}
.tbtn:hover{color:#fff}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 6px;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-head{padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-head h3{font-size:13px;font-weight:700;color:var(--ink-mid)}.card-body{padding:18px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:5px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{opacity:.85}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff}.btn-gold{background:var(--gold);color:var(--ink)}.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:var(--paper2);color:var(--ink-mid);border:1px solid var(--rule)}.btn-green{background:var(--green);color:#fff}.btn-sm{padding:3px 9px;font-size:12px}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-mid);margin-bottom:3px}
.field input,.field select,.field textarea,.inp{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue)}
.req{color:var(--red)}.hint{font-size:11px;color:var(--blue);margin-top:2px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:var(--paper);border-bottom:2px solid var(--rule);padding:9px 10px;font-size:12px;font-weight:700;color:var(--ink-mid);text-align:left;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--paper2);padding:8px 10px;font-size:13px;vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}.tbl .ctr{text-align:center}
.tbl tr.sum td{background:var(--gold-lt);font-weight:700}
.st{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.st-requested{background:#fff3cd;color:#8a6d00}.st-approved{background:var(--blue-lt);color:var(--blue)}.st-paid{background:#d9f0e2;color:var(--green)}.st-rejected{background:#f8d7da;color:var(--red)}
.neg{color:var(--red);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters select,.filters input{padding:5px 8px;border:1px solid var(--rule);border-radius:5px;font-size:12px;font-family:inherit}
.note{font-size:12px;color:var(--ink-soft);margin:6px 0}
.empty{padding:30px;text-align:center;color:var(--ink-soft)}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{padding:6px 14px;border-radius:20px;border:1px solid var(--rule);background:#fff;font-size:12px;cursor:pointer;font-family:inherit}
.subtabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
#login{max-width:340px;margin:80px auto;padding:0 16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;display:none;max-width:90vw}
#toast.err{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin-bottom:12px;font-size:15px}.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.scopegrid{border-collapse:collapse}.scopegrid th,.scopegrid td{border:1px solid var(--rule);padding:8px 14px;text-align:center;font-size:13px}.scopegrid th{background:var(--paper)}
.scopegrid input{width:18px;height:18px}
.slotrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.preview{display:flex;border:1px solid #000;width:max-content;margin:8px 0}.preview div{border-right:1px solid #000;min-width:70px;text-align:center;font-size:12px}.preview div:last-child{border-right:none}.preview b{display:block;background:#eee;border-bottom:1px solid #000;padding:2px 6px}.preview span{display:block;height:44px;padding-top:12px;color:#888}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.hright .who{display:none}}
.rscreen{min-width:760px;padding:10px}.rscreen .rtitle{text-align:center;font-size:17px;font-weight:700;text-decoration:underline;margin:4px 0 8px}.rscreen .rhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;font-size:12px}.rscreen table.rt{width:100%;border-collapse:collapse}.rscreen .rt th,.rscreen .rt td{border:1px solid #555;padding:3px 6px;font-size:12px}.rscreen .rt th{background:#eeecea}.rscreen .ap{border-collapse:collapse}.rscreen .ap th,.rscreen .ap td{border:1px solid #000;min-width:56px;text-align:center;padding:2px 5px;font-size:11px}.rscreen .ap td{height:34px}.rscreen .rnote{font-size:11px;color:#555;margin-top:6px}
.chk{display:flex!important;align-items:center;gap:6px;font-weight:400!important;margin:3px 0;font-size:13px!important}.chk input{width:auto;margin:0}
.lvbox{display:flex;gap:8px;flex-wrap:wrap}.lvbox label{display:flex!important;align-items:center;gap:5px;padding:5px 11px;border:2px solid var(--rule);border-radius:16px;cursor:pointer;font-weight:600!important}.lvbox input{width:auto;margin:0}
.lv{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;color:#fff;vertical-align:middle}.lv-red{background:#c0392b}.lv-yellow{background:#d4a017}.lv-green{background:#2e7d32}
.sigthumb{height:30px;max-width:80px;object-fit:contain;border:1px dashed #bbb;background:#fff}
.optchk{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin:2px 14px 8px 0;cursor:pointer}
.aplbl{font-size:12px;font-weight:700;color:var(--ink-mid);margin:2px 0 4px}
.apline{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;margin:0 0 8px}
.apline .grid2{display:contents}.apline .field{flex:1 1 90px;min-width:0;margin:0}.apline .field label{font-size:11px}.apline select{width:100%;min-width:0;font-size:13px}
.apline .note{display:none}.apline>.hint{flex-basis:100%;margin:2px 0 0 !important}
.todo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.todo-t{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit}
.todo-t b{font-size:22px}.todo-t.on{border:2px solid var(--blue)}.todo-t.warn{border:2px solid var(--red)}.todo-t.warn b{color:var(--red)}
</style>
</head>

<script>
const SUPABASE_URL='https://awkckynhksqnxmimpyft.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3a2NreW5oa3NxbnhtaW1weWZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NjczMDksImV4cCI6MjExMDA0MzMwOX0.fAD8fmyGJ8vpDj7ZOLB4kg1qmK11JKrgtCO0Jl46nII';
const ID_DOMAIN='youth.local';
// 로그인은 브라우저를 닫으면 끝납니다(로그인 유지 없음). 예전 '로그인 유지'로 남은 저장값은 정리
try{localStorage.removeItem('sh_keep');Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(_){}
const authStore={getItem:k=>{try{return sessionStorage.getItem(k)}catch(_){return null}},setItem:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(_){}},removeItem:k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(_){}}};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{storage:authStore,persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR');
const ROLE={spender:'지출자',accountant:'담당회계',admin:'관리자'};
const ST={requested:'신청',approved:'승인',paid:'입금완료',rejected:'반려'};
const DOCS={expense:'지출결의서',settlement:'결산',budget:'예산'};
const S={me:null,year:new Date().getFullYear(),tab:'req',sub:'perm',depts:[],cats:[],items:[],profiles:[],scopes:[],years:[],summary:[],expenses:[],borrows:[],slots:[],budgets:[],adjust:[],accts:[],bal:[],pay:[],deptCats:[],incCats:[],incItems:[],lines:[],plan:null,rd:'',funds:[],tx:[],anns:[],reads:new Set(),idem:null,f:{dept:'',status:'',mine:false}};

function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',err?6000:2500)}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args||{});if(error){toast(error.message,true);throw error}return data}
function isAdmin(){return S.me?.role==='admin'}
const okCombo=(d,c)=>S.deptCats.some(x=>x.dept_id===d&&x.category_id===c);
const catsOf=d=>S.cats.filter(c=>okCombo(d,c.id));
/* 통합 부서(1·2·3청 등): 예산·현황·감사에서는 하나로 표시 */
const mergedIds=()=>{const m=S.depts.filter(d=>d.merged).map(d=>d.id);return m.length>1?m:[]};
const isM=d=>mergedIds().includes(+d);
const memb=d=>isM(d)?mergedIds():[+d];
const leadId=()=>mergedIds()[0];
const dName=d=>isM(d)?'청년회 전체':dn(+d);
const viewDepts=()=>S.depts.filter(d=>!isM(d.id)||d.id===leadId());
const catsOfG=d=>S.cats.filter(c=>memb(d).some(x=>okCombo(x,c.id)));
function isMoney(){return S.me?.role==='accountant'||S.me?.role==='admin'}
function myScopes(){return S.scopes.filter(s=>s.user_id===S.me.user_id)}
function hasScope(d,c){return isAdmin()||(S.me?.role==='accountant'&&myScopes().some(s=>s.category_id===+c))}
function canProcess(e){return isAdmin()||hasScope(0,e.category_id)||(S.me.role==='accountant'&&!!e.event_id&&(S.events||[]).some(v=>v.id===e.event_id&&v.manager_id===S.me.user_id))}
const dn=id=>S.depts.find(d=>d.id===id)?.name||id, cn=id=>S.cats.find(c=>c.id===id)?.name||id, inm=id=>id?S.items.find(i=>i.id===id)?.name||'':'', pn=id=>S.profiles.find(p=>p.user_id===id)?.display_name||'';

/* ───── 로그인 ───── */
async function login(){
  const id=$('#lid').value.trim().toLowerCase(),pw=$('#lpw').value;
  if(!id||!pw)return toast('아이디와 비밀번호를 입력하세요.',true);
  const {error}=await sb.auth.signInWithPassword({email:`${id}@${ID_DOMAIN}`,password:pw});
  if(error)return toast('아이디 또는 비밀번호가 올바르지 않습니다.',true);
  const save=$('#lrem').checked;
  try{if(save){localStorage.setItem('sh_id',id);localStorage.setItem('sh_save','1')}else{localStorage.removeItem('sh_id');localStorage.setItem('sh_save','0')}}catch(_){}
  if(save&&window.PasswordCredential&&navigator.credentials){try{await navigator.credentials.store(new PasswordCredential({id,password:pw,name:id}))}catch(_){}}
  await boot();
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#login').style.display='block';$('#app').style.display='none';return}
  const {data:p}=await sb.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();
  if(!p||!p.active){await sb.auth.signOut();$('#login').style.display='block';return toast('사용할 수 없는 계정입니다. 관리자에게 문의하세요.',true)}
  S.me=p;$('#login').style.display='none';$('#app').style.display='block';
  $('#who').textContent=`${p.display_name} · ${ROLE[p.role]}`;
  S.tab=isMoney()?'todo':'req';await loadStatic();await loadYear();renderTabs();render();
  annPopup();retentionPopup();
}
async function loadStatic(){
  const q=t=>sb.from(t).select('*');
  const [d,c,i,p,s,y,sl]=await Promise.all([q('departments').order('sort_order').order('id'),q('categories').order('sort_order'),q('items').order('sort_order').order('id'),q('profiles').order('user_id'),q('user_scopes'),q('fiscal_years').order('year'),q('approval_slots').order('sort_order')]);
  S.depts=d.data||[];S.cats=c.data||[];S.items=i.data||[];S.profiles=p.data||[];S.scopes=s.data||[];S.years=y.data||[];S.slots=sl.data||[];
  if(isMoney()){const [a,b]=await Promise.all([q('bank_accounts').order('id'),sb.from('v_account_balance').select('*')]);S.accts=a.data||[];S.bal=b.data||[]}
  {const [r,ic,ii]=await Promise.all([q('dept_categories'),q('income_categories').order('sort_order'),q('income_items').order('sort_order')]);S.deptCats=r.data||[];S.incCats=ic.data||[];S.incItems=ii.data||[]}
  {const r=await q('sub_items').order('sort_order').order('id');S.subs=r.data||[]}
  {const r=await q('sub_accounts').order('sort_order').order('id');S.sacc=r.data||[]}
  {const [an,rd]=await Promise.all([q('announcements').order('id',{ascending:false}),sb.from('announcement_reads').select('announcement_id')]);S.anns=an.data||[];S.reads=new Set((rd.data||[]).map(x=>x.announcement_id))}
  const ys=S.years.map(x=>x.year);if(!ys.includes(S.year))S.year=ys.includes(new Date().getFullYear())?new Date().getFullYear():ys[ys.length-1];
  hySync();
}
function hySync(){const h=$('#hyear');if(!h)return;h.innerHTML=S.years.map(v=>`<option value="${v.year}">${v.year}</option>`).join('');h.value=String(S.year)}
async function loadYear(){

const snm=id=>(S.subs||[]).find(x=>x.id===id)?.name||'', subsFor=it=>(S.subs||[]).filter(x=>x.active&&x.item_id===+it);

function allowedCombos(){const md=MD();return S.cats.filter(c=>c.active&&(isAdmin()||myScopes().some(s=>s.category_id===c.id))).map(c=>({dept_id:md,category_id:c.id}))}
function itemsFor(d,c){return S.items.filter(i=>i.active&&i.category_id===+c)}
const reqCats=()=>S.cats.filter(c=>c.active);
const mnorm=t=>String(t||'').toLowerCase().replace(/\s+/g,'');
// 내용 → 행사(→항·목) / 목 / 적요 자동 매핑. 가장 길게 맞은 단어를 고름
function autoAcct(text,year,kind){
  const t=mnorm(text);if(!t)return {};
  const best=(list,keys)=>{let b=null,bl=0;list.forEach(x=>keys(x).map(mnorm).filter(k=>k.length>=2).forEach(k=>{if(t.includes(k)&&k.length>bl){bl=k.length;b=x}}));return b};
  const EA=S.evAll||S.events||[],evs=EA.filter(e=>e.status==='open'&&e.fiscal_year===year),ek=e=>[e.name,...(e.keywords||[])];
  let ev=best(evs,ek),it=null,evMiss=null;
  if(!ev){const x=best(EA,ek);if(x)evMiss=x.status!=='open'?`'${x.name}' 행사는 마감되어 고를 수 없습니다. [행사]에서 「행사개요 수정 › 다시 열기」를 해 주세요.`:`'${x.name}' 행사는 ${x.fiscal_year}년 행사라 ${year}년 지출에는 고를 수 없습니다. 지출일을 확인해 주세요.`}
  if(ev)it=S.items.find(i=>i.id===ev.item_id)||null;
  else{it=best(S.items.filter(i=>i.active&&S.cats.some(c=>c.id===i.category_id&&c.active)),i=>[i.name,...(i.keywords||[])]);
    if(it){const es=evs.filter(e=>e.item_id===it.id);if(es.length===1)ev=es[0]}}
  const ac=best(sacc(kind||'out').filter(x=>x.active),x=>[x.name,...(x.keywords||[])]);
  return {ev,it,ac,evMiss}}

    if(!L.length){q('e').innerHTML='<option value=""></option>';w.style.display='none';h.textContent='';return}
    if(L.length===1){q('e').innerHTML=`<option value="${L[0].id}" selected>${esc(L[0].name)}</option>`;w.style.display='none';
      h.innerHTML=`🎪 <b>${esc(L[0].name)}</b> 행사로 등록됩니다${L[0].status!=='open'?' (마감된 행사)':''}`;return}

// JPEG 사진의 촬영일(EXIF) 읽기 — 가볍고 즉시. 없거나 읽을 수 없으면 null
async function exifDate(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer(),v=new DataView(buf);
    if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o+4<=v.byteLength){
      const mk=v.getUint16(o);if((mk&0xFF00)!==0xFF00)return null;
      const len=v.getUint16(o+2);
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10,le=v.getUint16(t)===0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
        const ifd=off=>{const n=g16(t+off),a=[];for(let i=0;i<n;i++){const e=t+off+2+i*12;a.push({tag:g16(e),cnt:g32(e+4),val:e+8})}return a};
        const str=en=>{const p=en.cnt>4?t+g32(en.val):en.val;let r='';for(let i=0;i<en.cnt-1;i++)r+=String.fromCharCode(v.getUint8(p+i));return r};
        const i0=ifd(g32(t+4)),ex=i0.find(e=>e.tag===0x8769);let raw='';
        if(ex){const sub=ifd(g32(ex.val)),d=sub.find(e=>e.tag===0x9003)||sub.find(e=>e.tag===0x9004);if(d)raw=str(d)}
        if(!raw){const d=i0.find(e=>e.tag===0x0132);if(d)raw=str(d)}
        const m=/^(\d{4}):(\d{2}):(\d{2})/.exec(raw);if(!m)return null;
        const y=+m[1];if(y<2000||y>new Date().getFullYear()+1)return null;
        return `${m[1]}-${m[2]}-${m[3]}`;
      }
      if(mk===0xFFDA)return null;
      o+=2+len;
    }
  }catch(_){}
  return null;
}
function compress(file,max=1280,q=.75){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('압축 실패')),'image/jpeg',q)};
  img.onerror=()=>rej(new Error('이미지를 읽을 수 없습니다. JPG/PNG 사진을 선택하세요.'));img.src=u})}

async function act(a,id){

    if(a==='receipt'){const {data,error}=await sb.storage.from('receipts').createSignedUrl(e.receipt_path,300);if(error)return toast('영수증을 볼 권한이 없거나 파일이 없습니다.',true);return window.open(data.signedUrl,'_blank')}

    if(a==='del'){if(!confirm(`이 지출 내역을 삭제할까요?\n\n${e.description} · ${won(e.amount)}원\n\n· 휴지통으로 이동하며, 관리자가 복구할 수 있습니다.`+(e.status==='paid'?'\n· 이미 지급된 건이라 계좌 출금 기록도 함께 취소됩니다.':'')))return;await rpc('delete_expense',{p_id:e.id});toast('삭제했습니다.')}

function slotsBy(doc,o){return S.slots.filter(s=>s.doc_type===doc&&(s.owner_user_id||null)===(o||null)).sort((a,b)=>a.sort_order-b.sort_order)}
const apIsDam=l=>/^담당/.test(String(l||'').replace(/\s/g,'')); // 담당, 담당회계 등
// 회계별 담당 서명: 그 회계 전용 결재란(지출결의서)의 '담당' 칸 서명 이미지
const apDamSign=u=>u?(slotsBy('expense',u).find(s=>apIsDam(s.label))?.sign_img||''):'';
/* 결재란: 모든 문서 공통 1줄(기본 지출결의서 줄). 담당 칸 = who(승인한 회계). who를 안 주면 인쇄하는 회계 본인 */
function slotsFor(doc,dept,who){
  let base=slotsBy('expense',null);if(!base.length)base=slotsBy(doc,null);

  return base.map(s=>apIsDam(s.label)?{...s,signer:u?pn(u):'',sign_img:apDamSign(u)}:s)}

function apPrev(){return S.apRows.length?`<div class="preview">${S.apRows.map(r=>`<div><b>${esc(r.label||'　')}</b><span style="display:block;min-height:46px">${r.img?`<img src="${esc(r.img)}" style="max-width:60px;max-height:30px;display:block;margin:2px auto 0">`:''}${esc(r.signer)}</span></div>`).join('')}</div>`:''}
function signImg(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{URL.revokeObjectURL(u);for(const [mw,mh,fmt] of [[260,110,'png'],[200,80,'png'],[200,80,'jpeg'],[140,56,'jpeg']]){
    const r=Math.min(1,mw/im.width,mh/im.height),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');if(fmt==='jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);
    const d=cv.toDataURL('image/'+fmt,.85);if(d.length<=80000)return res(d)}rej(new Error('이미지가 너무 큽니다. 더 단순한 서명 이미지를 사용하세요.'))};
  im.onerror=()=>rej(new Error('이미지를 읽을 수 없습니다. JPG/PNG 파일을 선택하세요.'));im.src=u})}

    ${tb?`<tr><td colspan="${A?3:4}" class="c">자부담 (B)</td><td></td><td class="n">− ${won(tb)}</td></tr><tr class="sum"><td colspan="${A?3:4}" class="c">청구할 금액 (A − B)</td><td></td><td class="n">${won(te)}</td></tr>`:''}</table>

    }
  }
  printPages(EVCSS+pages.join(''),{res:true,title:`${S.year} 행사 정산 (${mode==='acct'?'적요별':'내역별'})`});

async function evAct(a,id){
  const cur=()=>evById(S.evId);
  try{
    if(a==='evnew')return eventModal(null);
    if(a==='evopen'){S.evId=+id;render();return window.scrollTo(0,0)}
    if(a==='evback'){S.evId=null;return render()}
    if(a==='evset')return eventModal(cur());
    if(a==='evprsel'){const ids=[...document.querySelectorAll('.evck:checked')].map(c=>+c.value);
      if(!ids.length)return toast('아래 지출내역을 체크해 주세요',true);
      return printResolutions(S.expenses.filter(e=>ids.includes(e.id)).sort((x,y)=>x.expense_date<y.expense_date?-1:x.expense_date>y.expense_date?1:x.id-y.id).map(resOf))}
    if(a==='evapx')return printEventSettle(null,'row');
    if(a==='evapxa')return printEventSettle(null,'acct');
    if(a==='evapx1')return printEventSettle(S.evId,'row');
    if(a==='evapxa1')return printEventSettle(S.evId,'acct');
    if(a==='evclose'){if(!confirm('이 행사를 마감할까요?\n\n마감하면 지출 신청 화면에서 이 행사를 고를 수 없습니다. (다시 열 수 있음)'))return;await rpc('set_event_status',{p_event:S.evId,p_open:false});toast('마감했습니다.')}
    if(a==='evreopen'){await rpc('set_event_status',{p_event:S.evId,p_open:true});toast('다시 열었습니다.')}
    if(a==='evdel'){const ev=cur();if(!confirm(`'${ev.name}' 행사를 삭제할까요?\n\n이 행사로 신청된 지출·수입이 있으면 삭제되지 않습니다. 되돌릴 수 없습니다.`))return;await rpc('delete_event',{p_event:ev.id});S.evId=null;toast('삭제했습니다.')}
    await loadYear();renderTabs();render();
  }catch(_){}
}

function todoData(){
  const E=(S.expenses||[]).filter(e=>!e.deleted_at&&canProcess(e));
  const card=E.filter(e=>e.pay_method==='card'&&(e.status==='requested'||e.status==='approved'));
  const fund=(S.funds||[]).filter(f=>f.status==='requested'&&(isAdmin()||hasScope(f.dept_id,f.category_id)));
  const payN=(S.pay||[]).reduce((s,g)=>s+ +g.cnt,0),payT=(S.pay||[]).reduce((s,g)=>s+ +g.total,0);
  return {card,fund,payN,payT,n:card.length+fund.length+payN}}
function renderTodo(){
  const d=todoData(),now=new Date(),last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),left=last-now.getDate();
  renderPay('pay');const main=$('#main'),pc=main.firstElementChild;if(pc)pc.id='todoPay';
  const tile=(ic,t,big,sub,go,cls)=>`<button type="button" class="todo-t ${cls||''}" data-go="${go}"><span>${ic} ${t}</span><b>${big}</b><span class="note">${sub}</span></button>`;
  main.insertAdjacentHTML('afterbegin',`<div class="todo-grid">
    ${tile('💸','입금할 전도금',d.payN+'건',won(d.payT)+'원','#todoPay',d.payN?'on':'')}
    ${tile('💳','카드 결제확인',d.card.length+'건',won(d.card.reduce((s,e)=>s+ +e.amount,0))+'원','#todoCard',d.card.length?'on':'')}
    ${tile('📥','수입 입금확인',d.fund.length+'건','예산 청구·수입','tab:fund',d.fund.length?'on':'')}
    ${tile('📅',(now.getMonth()+1)+'월 전도금 마감',left===0?'오늘':'D-'+left,(now.getMonth()+1)+'월 '+last+'일까지','#todoPay',left<=3?'warn':'')}</div>
    ${d.n?'':'<div class="card"><div class="card-body empty">지금 처리할 일이 없습니다. 👍</div></div>'}`);
  const tr=e=>`<tr><td>${e.expense_date}</td><td>${esc(cn(e.category_id))}${e.item_id?' / '+esc(inm(e.item_id)):''}${e.acct_id?' / '+esc(acNm(e.acct_id)):''}${e.event_id?`<div class="note">🎪 ${esc(evNm(e.event_id))}</div>`:''}</td><td>${esc(e.description)}${e.note?`<div class="note">${esc(e.note)}</div>`:''}</td><td class="num"><b>${won(e.amount)}</b></td><td>${esc(pn(e.requested_by))}</td>
    <td style="white-space:nowrap">${e.receipt_path?`<button class="btn btn-ghost btn-sm" data-act="receipt" data-id="${e.id}">영수증</button> `:''}<button class="btn btn-gold btn-sm" data-act="cardok" data-id="${e.id}">결제확인</button> <button class="btn btn-danger btn-sm" data-act="reject" data-id="${e.id}">반려</button>${canEditExp(e)?` <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${e.id}">수정</button>`:''}</td></tr>`;
  main.insertAdjacentHTML('beforeend',`<div class="card" id="todoCard"><div class="card-head"><h3>💳 체크카드 결제확인 (${d.card.length}건)</h3></div>
    ${d.card.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>지출일</th><th>항 / 목 / 적요</th><th>내용</th><th class="num">금액</th><th>신청자</th><th></th></tr></thead><tbody>${d.card.map(tr).join('')}</tbody></table></div>`:'<div class="empty">확인할 카드 결제가 없습니다. 👍</div>'}
    <div class="card-body"><p class="note">입금완료·결제확인을 누르면 승인도 함께 처리됩니다(따로 승인하지 않아도 됩니다). 잘못 올라온 신청은 [반려]하거나, 개인 결제 건은 [지출 › 지출 내역]에서 반려하세요.</p></div></div>`);
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g.startsWith('tab:')){S.tab=g.slice(4);renderTabs();return render()}const el=main.querySelector(g);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
}

function renderAlerts(){
  const el=$('#alertbar');if(!el)return;if(!S.me){el.innerHTML='';return}
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),last=new Date(y,m+1,0).getDate(),left=last-now.getDate();
  const lv=left<=3?'red':left<=7?'orange':'blue';
  const dd=left===0?'오늘 마감':`D-${left}`;
  const payN=isMoney()?(S.pay||[]).reduce((s,g)=>s+ +g.cnt,0):0,payT=isMoney()?(S.pay||[]).reduce((s,g)=>s+ +g.total,0):0;
  const mine=(S.expenses||[]).filter(e=>!e.deleted_at&&e.requested_by===S.me.user_id&&e.pay_method!=='card'&&(e.status==='requested'||e.status==='approved')).length;
  let msg=`💸 <b>${m+1}월 전도금 마감 ${m+1}월 ${last}일 (${dd})</b>`;
  if(isMoney())msg+=payN?` · 입금 대기 <b>${payN}건 ${won(payT)}원</b> <button class="btn btn-sm abtn" data-tab="pay">전도금 처리</button>`:' · 입금 대기 없음 👍';
  else msg+=' · 개인 결제 영수증은 마감 전에 꼭 신청해 주세요.'+(mine?` (내 처리 대기 ${mine}건)`:'');
  if(lv==='red')msg+=' <b>⚠ 전도금 처리를 서둘러 주세요!</b>';
  let h=`<div class="abar abar-${lv}">${msg}</div>`;
  if(m===11)h+=`<div class="abar abar-red">📅 <b>12월입니다 — ${y}년 지출은 해가 바뀌면 등록할 수 없습니다.</b> 남은 영수증·전도금을 12월 31일(D-${31-now.getDate()})까지 모두 정리해 주세요.</div>`;
  el.innerHTML=h;
}

function amtToKor(n){n=Math.floor(Number(n)||0);if(!n)return '영';const U=['','만','억','조'],D=['','일','이','삼','사','오','육','칠','팔','구'],P=['','십','백','천'];
  const blk=x=>{let s='';for(let i=3;i>=0;i--){const d=Math.floor(x/10**i)%10;if(!d)continue;s+=(d===1&&i>0?'':D[d])+P[i]}return s};

const PCSS=`@page{size:A4 %O%;margin:%M%}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{margin:0;background:#fff}body{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;color:#000}

.rhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;font-size:9.5pt}.ap{border-collapse:collapse}.ap th,.ap td{border:1px solid #000;min-width:58px;text-align:center;padding:2px 5px;font-size:8.5pt}.ap th{background:#eee}.ap td{height:46px;vertical-align:bottom;font-size:8pt}
table.rt{width:100%;border-collapse:collapse;table-layout:fixed}.rt th,.rt td{border:1px solid #000;padding:2px 4px;font-size:8.5pt;word-break:keep-all;overflow-wrap:anywhere}.rt th{background:#eeecea;text-align:center}.rnote{font-size:8pt;color:#333;margin-top:6px;line-height:1.6}
.res th{background:#f0f0f0;width:80px;white-space:nowrap}.res td,.res th{border:1px solid #000;padding:6px 8px;font-size:10.5pt}.res{width:100%;border-collapse:collapse;margin-bottom:6px}.rcpt{border:2px dashed #aaa;padding:6px;text-align:center}.rcpt img{max-width:100%;max-height:150mm;object-fit:contain}
.resv{height:276mm;display:flex;flex-direction:column;overflow:hidden}.resv .rhead{margin-bottom:6px}.resv .rtitle{margin:0 0 4px}.resv .res td,.resv .res th{padding:4px 8px}
.resv .rcpt{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center}.resv .rcap{font-size:8pt;color:#888;margin-bottom:2px;flex:none}
.resv .rcpt img{flex:1 1 0;min-height:0;width:100%;max-height:none;object-fit:contain}.resv .rnote{flex:none;margin-top:4px}`;
async function printPages(pagesHtml,o){o=o||{};
  const land=!!o.land,mar=o.res?'9mm 9mm':'19.05mm 17.78mm';
  const css=PCSS.replace('%O%',land?'landscape':'portrait').replace('%M%',mar);
  const old=document.getElementById('_pf');if(old)old.remove();
  const f=document.createElement('iframe');f.id='_pf';f.style.cssText='position:fixed;left:-9999px;top:0;width:1100px;height:800px;border:0';document.body.appendChild(f);
  const d=f.contentDocument;d.open();d.write(`<!doctype html><html><head><meta charset="UTF-8"><title>${esc(o.title||'출력')}</title><style>${css}</style></head><body>${pagesHtml}</body></html>`);d.close();
  const imgs=[...d.images];if(imgs.length){toast('이미지를 불러오는 중…');await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})))}
  if(o.fit){const mm=3.7795,W=((land?297:210)-35.56)*mm,H=((land?210:297)-38.1)*mm;
    d.querySelectorAll('.pg').forEach(p=>{p.style.width=W+'px';let s=1;for(let i=0;i<4;i++){const h=p.getBoundingClientRect().height;if(h<=H*.995)break;s*=H/h*.985;p.style.zoom=s;p.style.width=(W/s)+'px'}})}
  setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print()},250);
}

function monthlyModel(rows,a,b){

  const open=bal;const nI=ic.length,nE=ec.length;

    ic.map(c=>TH(c.name,{bg:'#F0FAF4'})).concat([TH('합계(A)',{bg:BG.inc})],ec.map(c=>TH(c.name,{bg:'#FEF5F5'})),[TH('합계(B)',{bg:BG.exp})])];

  const ci=ic.map(()=>0),ce=ec.map(()=>0);let ti=0,te=0;
  for(let mth=a;mth<=b;mth++){const rr=rows.filter(r=>mo(r)===mth&&!(r.kind==='income'&&r.inc_cat_id===cid));

    const si=sum(vi.map(v=>({v})),'v'),se=sum(ve.map(v=>({v})),'v');bal+=si-se;ti+=si;te+=se;vi.forEach((v,i)=>ci[i]+=v);ve.forEach((v,i)=>ce[i]+=v);

  body.push([H('수입합계(A)',{b:1,bg:BG.rem})].concat(blank(nI).map(c=>Object.assign(c,{bg:BG.rem})),[H(open+ti,{num:1,b:1,bg:BG.rem})],blank(nE).map(c=>Object.assign(c,{bg:BG.rem})),[H(te,{num:1,b:1,bg:BG.rem}),H(open+ti-te,{num:1,b:1,bg:BG.rem})]));
  return {title:`${y}년도 월별 수입·지출 내역서`+((a!==1||b!==12)?` (${a}월~${b}월)`:''),sheet:`${y}년도 월별수지`,sub:`소망교회 청년회 (${deptLabel()})\n(단위: 원)`,land:true,fitH:true,widths:[11].concat(ic.map(()=>12),[12],ec.map(()=>12),[12,13]),head,body};

function settleModel(qs){
  const y=S.year,cid=carryId(),months=qs.flatMap(q=>[3*q-2,3*q-1,3*q]);
  const ok=r=>(r.kind==='income'&&r.inc_cat_id===cid)||months.includes(+r.dt.slice(5,7));
  const lines=S.lines.filter(l=>(l.kind==='expense'||l.inc_cat_id)&&(!S.rd||memb(+S.rd).includes(l.dept_id)));
  const hasWhole={};lines.forEach(l=>{if(l.kind==='expense'&&!l.item_id)hasWhole['e|'+l.category_id]=1;if(l.kind==='income'&&!l.inc_cat_id&&!l.item_id)hasWhole['i|x'+l.category_id]=1;if(l.kind==='income'&&l.inc_cat_id&&!l.inc_item_id)hasWhole['i|'+l.inc_cat_id]=1});
  const K=(kind,c,it)=>{const base=(kind==='expense'?'e|':'i|')+c;return base+'|'+(hasWhole[base]?0:(it||0))};
  const map={};const g=(k,o)=>map[k]||(map[k]=Object.assign({a:0,b:0,c:0},o));
  lines.forEach(l=>{const e=l.kind==='expense',x=l.kind==='income'&&!l.inc_cat_id,c=x?'x'+l.category_id:(e?l.category_id:l.inc_cat_id),it=(e||x)?l.item_id:l.inc_item_id;g(K(l.kind,c,it),{kind:l.kind,cat:c,item:(hasWhole[(e?'e|':'i|')+c]?0:(it||0))}).b+=+l.amt_d});
  const feed=(rows,f)=>rows.filter(ok).forEach(r=>{const e=r.kind==='expense',c=e?r.category_id:r.inc_cat_id,it=e?r.item_id:r.inc_item_id,k=K(r.kind,c,it);
    g(k,{kind:r.kind,cat:c,item:hasWhole[(e?'e|':'i|')+c]?0:(it||0)})[f]+=+r.amount});
  feed(S._sc.cur,'c');feed(S._sc.prv,'a');
  const ord=(kind,c)=>kind==='expense'?S.cats.findIndex(x=>x.id===c):(typeof c==='string'?100+S.cats.findIndex(x=>x.id===+c.slice(1)):S.incCats.findIndex(x=>x.id===c));
  const sec=kind=>Object.values(map).filter(v=>v.kind===kind).sort((x,z)=>ord(kind,x.cat)-ord(kind,z.cat)||x.item-z.item);
  const body=[];const tot={income:{a:0,b:0,c:0},expense:{a:0,b:0,c:0}};
  const mk=(label,kind)=>{const L=sec(kind);L.forEach((v,i)=>{const xi=typeof v.cat==='string',nm=kind==='expense'?cn(v.cat):(xi?cn(+v.cat.slice(1)):incCn(v.cat)),it=v.item?((kind==='expense'||xi)?inm(v.item):incIn(v.item)):'';
      const T=tot[kind];T.a+=v.a;T.b+=v.b;T.c+=v.c;const r=[];
      if(i===0)r.push(H(label,{rs:L.length,al:'c',b:1}));
      if(i===0||L[i-1].cat!==v.cat){let n=0;while(i+n<L.length&&L[i+n].cat===v.cat)n++;r.push(H(nm,{rs:n}))}
      r.push(H(it),H(v.a,{num:1}),H(v.b,{num:1}),H(v.c,{num:1}),H(v.c-v.a,{num:1,color:v.c-v.a<0?'#c0392b':'#1a6b3c'}),H(v.b-v.c,{num:1,color:v.b-v.c<0?'#c0392b':'#1a6b3c'}),H(''));body.push(r)})};
  const foot=(lab,T,bg)=>body.push([H(lab,{cs:3,b:1,bg}),H(T.a,{num:1,b:1,bg}),H(T.b,{num:1,b:1,bg}),H(T.c,{num:1,b:1,bg}),H(T.c-T.a,{num:1,b:1,bg}),H(T.b-T.c,{num:1,b:1,bg}),H('',{bg})]);
  mk('수입','income');foot('수입 합계(1)',tot.income,BG.sum);mk('지출','expense');foot('지출 합계(2)',tot.expense,BG.sum);
  const I=tot.income,E=tot.expense,R={a:I.a-E.a,b:I.b-E.b,c:I.c-E.c};foot('잔액(1-2) — 다음년도 이월액',R,BG.rem);
  const qlabel=qs.length===4?'1~4분기 (연간)':qs.map(q=>q+'분기').join('·')+' 누계';
  return {title:`${y}년도 수입, 지출 결산보고서`,sheet:`${y}년도 수지결산`,sub:`소망교회 청년회 (${deptLabel()})\n(${y}년 ${qlabel}) (단위: 원)`,land:true,fitH:true,sign:slotsFor('settlement',S.rd?+S.rd:null).map(s=>({label:s.label,signer:s.signer,img:s.sign_img})),
   widths:[7,18,24,13,13,13,13,13,10],
   head:[[TH('구분',{rs:2}),TH('항(대분류)',{rs:2}),TH('목(소분류)',{rs:2}),TH(`${y-1}년\n금액(A)`,{rs:2}),TH(`${y}년도`,{cs:2,bg:'#E8EEF8'}),TH('증감',{cs:2,bg:'#FEF9E6'}),TH('비고',{rs:2})],[TH('예산액(B)',{bg:'#E8EEF8'}),TH('금액(C)',{bg:'#E8EEF8'}),TH('전년대비\n(C-A)',{bg:'#FEF9E6'}),TH('예산대비\n(B-C)',{bg:'#FEF9E6'})]],
   body,notes:['1. 연간 예산 범위 내에서 절감 운용되어야 하며 부득이 예산 초과시에는 절차에 의한 추가예산 배정을 받아야 합니다.','2. 비용집행에 따른 증빙처리(6하원칙)를 잘해주시기 바랍니다.']};
}


/* ── 금액 입력칸: 세 자리마다 콤마(,) 표시. 코드에서 .value를 읽으면 콤마 없는 숫자만 돌려줌 ── */
(function(){
  const D=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  const fmt=v=>{const d=String(v??'').replace(/[^0-9]/g,'').replace(/^0+(?=[0-9])/,'');return d?d.replace(/\B(?=([0-9]{3})+(?![0-9]))/g,','):''};
  const wire=el=>{if(el._amt)return;el._amt=1;
    Object.defineProperty(el,'value',{configurable:true,get(){return D.get.call(this).replace(/[^0-9]/g,'')},set(v){D.set.call(this,fmt(v))}});
    D.set.call(el,fmt(D.get.call(el)));
    el.addEventListener('input',()=>{const raw=D.get.call(el),pos=el.selectionStart??raw.length,nd=raw.slice(0,pos).replace(/[^0-9]/g,'').length,f=fmt(raw);
      if(f===raw)return;D.set.call(el,f);let i=0,c=0;while(i<f.length&&c<nd){if(f[i]!==',')c++;i++}try{el.setSelectionRange(i,i)}catch(_){}},true)};
  const scan=r=>{if(r.matches&&r.matches('input.amt'))wire(r);if(r.querySelectorAll)r.querySelectorAll('input.amt').forEach(wire)};
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(x=>{if(x.nodeType===1)scan(x)}))).observe(document.body,{childList:true,subtree:true});
  scan(document.body);
})();

/* ── 날짜 입력 보정: 연도 4자리(2000~2099), YYYY-MM-DD 형식만 허용 ── */
(function(){
  const DMIN='2000-01-01',DMAX='2099-12-31',MSG='날짜는 연도 4자리로 정확히 입력하세요. (예: 2026-11-13)';
  const lim=t=>{if(t&&t.type==='date'){t.min=DMIN;t.max=DMAX}};
  document.addEventListener('focusin',e=>lim(e.target));
  const fix=e=>{const t=e.target;if(!t||t.type!=='date')return;const v=t.value;
    if(v&&(!/^\d{4}-\d{2}-\d{2}$/.test(v)||v<DMIN||v>DMAX)){t.value='';toast(MSG,true)}};
  document.addEventListener('input',fix);document.addEventListener('change',fix);
  document.addEventListener('focusout',e=>{const t=e.target;if(t&&t.type==='date'&&t.validity&&t.validity.badInput){t.value='';toast(MSG,true)}});
})();

/* ── 자동 로그아웃: 15분 무작업 시, 만료 60초 전부터 카운트다운 팝업 ── */
(function(){
  const IDLE=15*60*1000,WARN=60*1000;let last=Date.now(),pop=null;
  const act=()=>{if(pop)return;last=Date.now()};      // 팝업이 떠 있을 때는 [계속 사용] 버튼으로만 연장
  ['mousemove','mousedown','keydown','touchstart','scroll','wheel'].forEach(ev=>window.addEventListener(ev,act,{passive:true,capture:true}));
  async function out(){
    if(pop){pop.remove();pop=null}
    document.querySelectorAll('.modal-bg').forEach(x=>x.remove());
    try{await sb.auth.signOut()}catch(_){}
    S.me=null;$('#app').style.display='none';$('#login').style.display='block';$('#lpw').value='';
    toast('15분 동안 작업이 없어 자동 로그아웃되었습니다.',true);
  }
  setInterval(()=>{
    if(!S.me)return;
    const left=IDLE-(Date.now()-last);
    if(left<=0)return out();
    if(left<=WARN){
      if(!pop){pop=modal(`<h3 style="color:var(--red)">⏱ 자동 로그아웃 예정</h3><p>장시간 작업이 없어 <b id="idle-s" style="font-size:20px;color:var(--red)">60</b>초 후 자동으로 로그아웃됩니다.</p><div class="actions"><button class="btn btn-ghost" id="idle-out">지금 로그아웃</button><button class="btn btn-primary" id="idle-stay">계속 사용</button></div>`);
        pop.querySelector('#idle-stay').onclick=()=>{pop.remove();pop=null;last=Date.now()};
        pop.querySelector('#idle-out').onclick=()=>out()}
      const e=pop&&pop.querySelector('#idle-s');if(e)e.textContent=Math.max(0,Math.ceil(left/1000));
    }else if(pop){pop.remove();pop=null}
  },1000);
  window.__idleTest={set:ms=>{last=Date.now()-(IDLE-ms)}};
})();

/* ── 공지 팝업: 로그인 중에도 새 공지를 주기적으로 확인해 팝업 표시 ── */
setInterval(async()=>{
  if(!S.me||document.hidden)return;
  try{const [an,rd]=await Promise.all([sb.from('announcements').select('*').order('id',{ascending:false}),sb.from('announcement_reads').select('announcement_id')]);
    if(an.error||rd.error)return;S.anns=an.data||[];S.reads=new Set((rd.data||[]).map(x=>x.announcement_id));renderTabs();annPopup(null,true)}catch(_){}
},90000);
</script>
