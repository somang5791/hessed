<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--ink:#1a1a2e;--ink-mid:#3d3d5c;--ink-soft:#7b7b9a;--paper:#f7f6f2;--paper2:#eeecea;--rule:#d8d5cf;--gold:#b8860b;--gold-lt:#f5ecc8;--red:#c0392b;--green:#1a6b3c;--blue:#1a3a6b;--blue-lt:#e8eef8;--shadow:0 2px 12px rgba(26,26,46,.08);--shadow-md:0 4px 24px rgba(26,26,46,.13);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6}
header{background:#fff;color:var(--ink);border-bottom:1px solid var(--rule);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow)}
.hbrand{display:flex;align-items:center;gap:8px;min-width:0}.hbrand img{width:36px;height:36px;flex-shrink:0}.hbrand h1{letter-spacing:.12em}
.hbrand h1{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;align-items:center;gap:8px;font-size:12px}
.who{background:var(--paper2);color:var(--ink-mid);font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.year-nav{background:var(--blue);color:#fff;padding:6px 16px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;position:sticky;top:56px;z-index:195}
.year-nav select{padding:3px 6px;border-radius:4px;border:none;font-weight:700}
.lockbadge{background:var(--gold);color:var(--ink);font-size:11px;padding:1px 8px;border-radius:10px}
nav.tabs{background:#fff;border-bottom:2px solid var(--rule);padding:0 8px;display:flex;overflow-x:auto;position:sticky;top:100px;z-index:190;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.subnav{background:var(--paper);border-bottom:1px solid var(--rule);padding:8px 12px;display:flex;gap:6px;overflow-x:auto;position:sticky;top:141px;z-index:185;scrollbar-width:none}
.subnav button{padding:5px 14px;border-radius:20px;border:1px solid var(--rule);background:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.subnav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tbtn{padding:10px 9px;font-size:12.5px;font-weight:500;color:var(--ink-soft);background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-2px;font-family:inherit}
.tbtn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 6px;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-head{padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-head h3{font-size:13px;font-weight:700;color:var(--ink-mid)}.card-body{padding:18px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:5px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{opacity:.85}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff}.btn-gold{background:var(--gold);color:var(--ink)}.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:var(--paper2);color:var(--ink-mid);border:1px solid var(--rule)}.btn-green{background:var(--green);color:#fff}.btn-sm{padding:3px 9px;font-size:12px}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-mid);margin-bottom:3px}
.field input,.field select,.field textarea,.inp{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue)}
.req{color:var(--red)}.hint{font-size:11px;color:var(--blue);margin-top:2px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:var(--paper);border-bottom:2px solid var(--rule);padding:9px 10px;font-size:12px;font-weight:700;color:var(--ink-mid);text-align:left;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--paper2);padding:8px 10px;font-size:13px;vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}.tbl .ctr{text-align:center}
.tbl tr.sum td{background:var(--gold-lt);font-weight:700}
.st{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.st-requested{background:#fff3cd;color:#8a6d00}.st-approved{background:var(--blue-lt);color:var(--blue)}.st-paid{background:#d9f0e2;color:var(--green)}.st-rejected{background:#f8d7da;color:var(--red)}
.neg{color:var(--red);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters select,.filters input{padding:5px 8px;border:1px solid var(--rule);border-radius:5px;font-size:12px;font-family:inherit}
.note{font-size:12px;color:var(--ink-soft);margin:6px 0}
.empty{padding:30px;text-align:center;color:var(--ink-soft)}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{padding:6px 14px;border-radius:20px;border:1px solid var(--rule);background:#fff;font-size:12px;cursor:pointer;font-family:inherit}
.subtabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
#login{max-width:340px;margin:80px auto;padding:0 16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;display:none;max-width:90vw}
#toast.err{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin-bottom:12px;font-size:15px}.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.scopegrid{border-collapse:collapse}.scopegrid th,.scopegrid td{border:1px solid var(--rule);padding:8px 14px;text-align:center;font-size:13px}.scopegrid th{background:var(--paper)}
.scopegrid input{width:18px;height:18px}
.slotrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.preview{display:flex;border:1px solid #000;width:max-content;margin:8px 0}.preview div{border-right:1px solid #000;min-width:70px;text-align:center;font-size:12px}.preview div:last-child{border-right:none}.preview b{display:block;background:#eee;border-bottom:1px solid #000;padding:2px 6px}.preview span{display:block;height:44px;padding-top:12px;color:#888}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.hright .who{display:none}}
.rscreen{min-width:760px;padding:10px}.rscreen .rtitle{text-align:center;font-size:17px;font-weight:700;text-decoration:underline;margin:4px 0 8px}.rscreen .rhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;font-size:12px}.rscreen table.rt{width:100%;border-collapse:collapse}.rscreen .rt th,.rscreen .rt td{border:1px solid #555;padding:3px 6px;font-size:12px}.rscreen .rt th{background:#eeecea}.rscreen .ap{border-collapse:collapse}.rscreen .ap th,.rscreen .ap td{border:1px solid #000;min-width:56px;text-align:center;padding:2px 5px;font-size:11px}.rscreen .ap td{height:34px}.rscreen .rnote{font-size:11px;color:#555;margin-top:6px}
.chk{display:flex!important;align-items:center;gap:6px;font-weight:400!important;margin:3px 0;font-size:13px!important}.chk input{width:auto;margin:0}
.lvbox{display:flex;gap:8px;flex-wrap:wrap}.lvbox label{display:flex!important;align-items:center;gap:5px;padding:5px 11px;border:2px solid var(--rule);border-radius:16px;cursor:pointer;font-weight:600!important}.lvbox input{width:auto;margin:0}
.lv{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;color:#fff;vertical-align:middle}.lv-red{background:#c0392b}.lv-yellow{background:#d4a017}.lv-green{background:#2e7d32}
.sigthumb{height:30px;max-width:80px;object-fit:contain;border:1px dashed #bbb;background:#fff}
</style>
</head>

function compress(file,max=1280,q=.75){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('압축 실패')),'image/jpeg',q)};
  img.onerror=()=>rej(new Error('이미지를 읽을 수 없습니다. JPG/PNG 사진을 선택하세요.'));img.src=u})}

    await rpc('submit_expense',{p_year:S.year,p_dept:+$('#rd').value,p_cat:+$('#rc').value,p_item:$('#ri').value?+$('#ri').value:null,p_amount:amt,p_description:desc,p_note:$('#rn').value.trim()||null,p_date:$('#rdt').value,p_receipt_path:path,p_payee_holder:ph,p_payee_bank:pb,p_payee_account:pa,p_idem:S.idem});

async function act(a,id){

function slotsBy(doc,o){return S.slots.filter(s=>s.doc_type===doc&&(s.owner_user_id||null)===(o||null)).sort((a,b)=>a.sort_order-b.sort_order)}
/* 결재란 선택: 보는 사람이 담당회계면 본인 것 → 해당 부서 담당회계의 개별 결재란 → 기본 순서 */
function slotsFor(doc,dept){
  const cand=[];if(S.me.role==='accountant')cand.push(S.me.user_id);
  if(dept)S.profiles.filter(p=>p.role==='accountant'&&S.scopes.some(x=>x.user_id===p.user_id&&x.dept_id===+dept)).forEach(p=>cand.push(p.user_id));
  for(const o of cand){const r=slotsBy(doc,o);if(r.length)return r}
  return slotsBy(doc,null)}
function printHTML(title,body,doc,dept){
  const sl=slotsFor(doc,dept);
  const box=sl.length?`<table class="ap"><tr>${sl.map(s=>`<th>${esc(s.label)}</th>`).join('')}</tr><tr>${sl.map(s=>`<td>${s.sign_img?`<img src="${esc(s.sign_img)}" style="max-width:56px;max-height:30px;display:block;margin:0 auto">`:''}${esc(s.signer||'')}</td>`).join('')}</tr></table>`:'';
  return `<html><head><meta charset="UTF-8"><title>${esc(title)}</title><style>@page{size:A4;margin:15mm}body{font-family:'Malgun Gothic',sans-serif;font-size:12px}h2{text-align:center;margin:10px 0 14px;font-size:20px}.ap{border-collapse:collapse;margin-left:auto}.ap th,.ap td{border:1px solid #000;min-width:60px;text-align:center;padding:3px 6px}.ap th{background:#eee}.ap td{height:46px}table.d{width:100%;border-collapse:collapse;margin-top:14px}table.d th,table.d td{border:1px solid #000;padding:7px 9px;text-align:left}table.d th{background:#f2f2f2;width:22%}</style></head><body>${box}<h2>${esc(title)}</h2>${body}</body></html>`;
}

function signImg(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{URL.revokeObjectURL(u);for(const [mw,mh,fmt] of [[260,110,'png'],[200,80,'png'],[200,80,'jpeg'],[140,56,'jpeg']]){
    const r=Math.min(1,mw/im.width,mh/im.height),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');if(fmt==='jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);
    const d=cv.toDataURL('image/'+fmt,.85);if(d.length<=80000)return res(d)}rej(new Error('이미지가 너무 큽니다. 더 단순한 서명 이미지를 사용하세요.'))};
  im.onerror=()=>rej(new Error('이미지를 읽을 수 없습니다. JPG/PNG 파일을 선택하세요.'));im.src=u})}

function badgeOf(k){
  if(k==='list')return pendingCount()-(isAdmin()?S.borrows.filter(b=>b.status==='requested').length:0);
  if(k==='pay')return S.pay.length;
  if(k==='fund')return (S.funds||[]).filter(f=>f.status==='requested'&&(isAdmin()||hasScope(f.dept_id,f.category_id))).length;
  if(k==='borrow')return isAdmin()?S.borrows.filter(b=>b.status==='requested').length:0;
  if(k==='annlist')return unreadAnn().length;return 0}
function renderTabs(){
  const cur=topOf(S.tab),tops=MENU.filter(m=>m.vis()&&subOf(m).length);

async function planPull(){

    let upd=0,added=0;
    Object.entries(agg).forEach(([k,v])=>{if(!v.a&&!v.b&&!v.c1)return;let r=p.rows.find(x=>rk(x)===k);
      if(!r){if(v.kind==='expense'&&!okCombo(d,v.category_id))return;r={kind:v.kind,cat:v.category_id||null,item:v.item_id||null,icat:v.inc_cat_id||null,iitem:v.inc_item_id||null,a:0,b:0,c1:0,c2:0,d:0,note:''};p.rows.push(r);added++}else upd++;
      r.a=v.a;r.b=v.b;r.c1=v.c1});
    p.dirty=true;renderPlan();toast(`전년도 자료를 불러왔습니다. (추가 ${added}줄 · 갱신 ${upd}줄) 저장해야 반영됩니다.`);
  }catch(_){}
}

async function renderDaily(){

function dailyModel(rows,from,to,chk){
  const y=S.year,cid=carryId();

  const list=rows.filter(r=>!(r.kind==='income'&&r.inc_cat_id===cid)).sort((a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:(a.kind==='income'?-1:1)-(b.kind==='income'?-1:1)||a.ref_id-b.ref_id);
  let bal=carry,prev='',ti=0,te=0;const body=[];
  const lead=h=>chk?[H('',{h})]:[];
  body.push(lead('').concat([H(`${y}.1.1.`),H('전년도에서 이월금'),H('이월금'),H(carry,{num:1,color:'#1a6b3c'}),H('',{}),H(carry,{num:1,b:1}),H('')].map(c=>Object.assign(c,{bg:BG.sum,b:1}))));
  list.forEach(r=>{const inc=r.kind==='income';bal+=inc?+r.amount:-r.amount;if(from&&r.dt<from)return;if(to&&r.dt>to)return;
    if(inc)ti+=+r.amount;else te+=+r.amount;const dc=r.dt===prev?'':r.dt;prev=r.dt;
    body.push(lead(inc?'':`<input type="checkbox" class="dchk" data-id="${r.ref_id}">`).concat([H(dc),H(r.summary),H(acctName(r)),H(inc?+r.amount:'',{num:1,color:'#1a6b3c'}),H(inc?'':+r.amount,{num:1,color:'#c0392b'}),H(bal,{num:1,b:1,color:bal<0?'#c0392b':'#1a3a6b'}),H(r.note||'')]))});
  body.push(lead('').concat([H('기간 합계',{cs:3,b:1,bg:BG.sum}),H(ti,{num:1,b:1,bg:BG.sum}),H(te,{num:1,b:1,bg:BG.sum}),H(bal,{num:1,b:1,bg:BG.sum}),H('',{bg:BG.sum})]));
  const hd=[TH('년월일'),TH('적요'),TH('계정(항 / 목)'),TH('수입(C)'),TH('지출(D)'),TH('잔액'),TH('비고')];
  return {title:`${y}년도 수입·지출 일일내역서`+((from||to)?` (${from||'처음'} ~ ${to||'끝'})`:''),sheet:`${y}년도 일일수지`,sub:`소망교회 청년회 (${deptLabel()})\n(단위: 원)`,land:false,fitH:false,
    widths:chk?[4,11,24,16,12,12,13,14]:[11,24,16,12,12,13,14],head:[chk?[TH('',{h:`<input type="checkbox" id="dchkall">`})].concat(hd):hd],body};
}

/* ── 월별 수지내역 ── */
async function renderMonthly(){
  const y=S.year;$('#main').innerHTML='<div class="card"><div class="card-body empty">불러오는 중…</div></div>';
  const rows=(await rpc('report_rows',{p_year:y})).filter(inDept);

   ${deptBar(`<label>기간 <select id="mf">${opt(a)}</select> ~ <select id="mt">${opt(b)}</select></label>`)}
   <div style="display:flex;gap:6px;margin:8px 0"><button class="btn btn-ghost btn-sm" id="mpr">인쇄</button><button class="btn btn-ghost btn-sm" id="mxl">엑셀</button></div></div><div class="tblwrap">${mHTML(m,true)}</div></div>`;

function monthlyModel(rows,a,b){
  const y=S.year,cid=carryId();
  const ic=S.incCats.filter(c=>c.id!==cid&&(c.active||rows.some(r=>r.inc_cat_id===c.id)));
  const ec=S.cats.filter(c=>c.active||rows.some(r=>r.category_id===c.id));
  const mo=r=>+r.dt.slice(5,7);
  const carry=sum(rows.filter(r=>r.kind==='income'&&r.inc_cat_id===cid),'amount');
  const pre=rows.filter(r=>!(r.kind==='income'&&r.inc_cat_id===cid)&&mo(r)<a);
  let bal=carry+sum(pre.filter(r=>r.kind==='income'),'amount')-sum(pre.filter(r=>r.kind==='expense'),'amount');
  const open=bal;const nI=ic.length,nE=ec.length;
  const head=[[TH('년월일',{rs:2}),TH('수입(A)',{cs:nI+1,bg:BG.inc}),TH('지출(B)',{cs:nE+1,bg:BG.exp}),TH('잔액\n(A-B)',{rs:2,bg:BG.rem})],
    ic.map(c=>TH(c.name,{bg:'#F0FAF4'})).concat([TH('합계(A)',{bg:BG.inc})],ec.map(c=>TH(c.name,{bg:'#FEF5F5'})),[TH('합계(B)',{bg:BG.exp})])];
  const body=[];const blank=n=>Array.from({length:n},()=>H(''));
  body.push([H(a===1?`${y}.1.1.`:`${y}.${a-1}월말 이월`,{b:1,bg:BG.sum})].concat(blank(nI),[H(open,{num:1,b:1,bg:BG.sum})],blank(nE),[H(0,{num:1,b:1,bg:BG.sum}),H(open,{num:1,b:1,bg:BG.sum})]));
  const ci=ic.map(()=>0),ce=ec.map(()=>0);let ti=0,te=0;
  for(let mth=a;mth<=b;mth++){const rr=rows.filter(r=>mo(r)===mth&&!(r.kind==='income'&&r.inc_cat_id===cid));
    const vi=ic.map(c=>sum(rr.filter(r=>r.kind==='income'&&r.inc_cat_id===c.id),'amount')),ve=ec.map(c=>sum(rr.filter(r=>r.kind==='expense'&&r.category_id===c.id),'amount'));
    const si=sum(vi.map(v=>({v})),'v'),se=sum(ve.map(v=>({v})),'v');bal+=si-se;ti+=si;te+=se;vi.forEach((v,i)=>ci[i]+=v);ve.forEach((v,i)=>ce[i]+=v);
    body.push([H(`${y}.${mth}월`)].concat(vi.map(v=>H(v||'',{num:1})),[H(si,{num:1,b:1,color:'#1a6b3c'})],ve.map(v=>H(v||'',{num:1})),[H(se,{num:1,b:1,color:'#c0392b'}),H(bal,{num:1,b:1,color:bal<0?'#c0392b':'#1a3a6b'})]))}
  body.push([H('소 계',{b:1,bg:BG.head})].concat(ci.map(v=>H(v,{num:1,b:1,bg:BG.head})),[H(ti,{num:1,b:1,bg:BG.head})],ce.map(v=>H(v,{num:1,b:1,bg:BG.head})),[H(te,{num:1,b:1,bg:BG.head}),H(bal,{num:1,b:1,bg:BG.head})]));
  body.push([H('수입합계(A)',{b:1,bg:BG.rem})].concat(blank(nI).map(c=>Object.assign(c,{bg:BG.rem})),[H(open+ti,{num:1,b:1,bg:BG.rem})],blank(nE).map(c=>Object.assign(c,{bg:BG.rem})),[H(te,{num:1,b:1,bg:BG.rem}),H(open+ti-te,{num:1,b:1,bg:BG.rem})]));
  return {title:`${y}년도 월별 수입·지출 내역서`+((a!==1||b!==12)?` (${a}월~${b}월)`:''),sheet:`${y}년도 월별수지`,sub:`소망교회 청년회 (${deptLabel()})\n(단위: 원)`,land:true,fitH:true,widths:[11].concat(ic.map(()=>12),[12],ec.map(()=>12),[12,13]),head,body};
}

/* ── 수지결산보고서 (분기 선택) ── */
async function renderSettle(){
  const y=S.year;$('#main').innerHTML='<div class="card"><div class="card-body empty">불러오는 중…</div></div>';
  const [cur,prv]=await Promise.all([rpc('report_rows',{p_year:y}),rpc('report_rows',{p_year:y-1})]);
  S._sc={cur:cur.filter(inDept),prv:prv.filter(inDept)};
  const qs=S.qs||[1,2,3,4];const m=settleModel(qs);
  $('#main').innerHTML=`<div class="card"><div class="card-head"><h3>${y}년 수지결산보고서</h3></div><div class="card-body">
   ${deptBar('<span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+[1,2,3,4].map(q=>`<label><input type="checkbox" class="qchk" value="${q}" ${qs.includes(q)?'checked':''}> ${q}분기(${3*q-2}~${3*q}월)</label>`).join('')+'</span>')}
   <p class="note">체크한 분기의 누계입니다. 전년 금액(A)은 전년도 같은 분기의 실적, 예산(B)은 연간 예산입니다. 이월금은 분기와 관계없이 포함됩니다.</p>
   <div style="display:flex;gap:6px;margin:8px 0"><button class="btn btn-ghost btn-sm" id="spr">인쇄</button><button class="btn btn-ghost btn-sm" id="sxl">엑셀</button></div></div><div class="tblwrap">${mHTML(m,true)}</div></div>`;
  wireDept(renderSettle);
  document.querySelectorAll('.qchk').forEach(c=>c.onchange=()=>{const v=[...document.querySelectorAll('.qchk:checked')].map(x=>+x.value);if(!v.length){c.checked=true;return toast('분기를 하나 이상 선택하세요.',true)}S.qs=v;renderSettle()});
  $('#spr').onclick=()=>printPages(mHTML(m),{land:true,fit:true,title:`${y} 수지결산보고서`});
  $('#sxl').onclick=()=>mXLSX(m,`${y}_${deptLabel()}_수지결산보고서`);

function settleModel(qs){
  const y=S.year,cid=carryId(),months=qs.flatMap(q=>[3*q-2,3*q-1,3*q]);
  const ok=r=>(r.kind==='income'&&r.inc_cat_id===cid)||months.includes(+r.dt.slice(5,7));
  const lines=S.lines.filter(l=>!S.rd||l.dept_id===+S.rd);
  const hasWhole={};lines.forEach(l=>{if(l.kind==='expense'&&!l.item_id)hasWhole['e|'+l.category_id]=1;if(l.kind==='income'&&!l.inc_item_id)hasWhole['i|'+l.inc_cat_id]=1});
  const K=(kind,c,it)=>{const base=(kind==='expense'?'e|':'i|')+c;return base+'|'+(hasWhole[base]?0:(it||0))};
  const map={};const g=(k,o)=>map[k]||(map[k]=Object.assign({a:0,b:0,c:0},o));
  lines.forEach(l=>{const e=l.kind==='expense';g(K(l.kind,e?l.category_id:l.inc_cat_id,e?l.item_id:l.inc_item_id),{kind:l.kind,cat:e?l.category_id:l.inc_cat_id,item:(e?l.item_id:l.inc_item_id)||0}).b+=+l.amt_d});
  const feed=(rows,f)=>rows.filter(ok).forEach(r=>{const e=r.kind==='expense',c=e?r.category_id:r.inc_cat_id,it=e?r.item_id:r.inc_item_id,k=K(r.kind,c,it);
    g(k,{kind:r.kind,cat:c,item:hasWhole[(e?'e|':'i|')+c]?0:(it||0)})[f]+=+r.amount});
  feed(S._sc.cur,'c');feed(S._sc.prv,'a');
  const ord=(kind,c)=>kind==='expense'?S.cats.findIndex(x=>x.id===c):S.incCats.findIndex(x=>x.id===c);
  const sec=kind=>Object.values(map).filter(v=>v.kind===kind).sort((x,z)=>ord(kind,x.cat)-ord(kind,z.cat)||x.item-z.item);
  const body=[];const tot={income:{a:0,b:0,c:0},expense:{a:0,b:0,c:0}};
  const mk=(label,kind)=>{const L=sec(kind);L.forEach((v,i)=>{const nm=kind==='expense'?cn(v.cat):incCn(v.cat),it=v.item?(kind==='expense'?inm(v.item):incIn(v.item)):'';
      const T=tot[kind];T.a+=v.a;T.b+=v.b;T.c+=v.c;const r=[];
      if(i===0)r.push(H(label,{rs:L.length,al:'c',b:1}));
      if(i===0||L[i-1].cat!==v.cat){let n=0;while(i+n<L.length&&L[i+n].cat===v.cat)n++;r.push(H(nm,{rs:n}))}
      r.push(H(it),H(v.a,{num:1}),H(v.b,{num:1}),H(v.c,{num:1}),H(v.c-v.a,{num:1,color:v.c-v.a<0?'#c0392b':'#1a6b3c'}),H(v.b-v.c,{num:1,color:v.b-v.c<0?'#c0392b':'#1a6b3c'}),H(''));body.push(r)})};
  const foot=(lab,T,bg)=>body.push([H(lab,{cs:3,b:1,bg}),H(T.a,{num:1,b:1,bg}),H(T.b,{num:1,b:1,bg}),H(T.c,{num:1,b:1,bg}),H(T.c-T.a,{num:1,b:1,bg}),H(T.b-T.c,{num:1,b:1,bg}),H('',{bg})]);
  mk('수입','income');foot('수입 합계(1)',tot.income,BG.sum);mk('지출','expense');foot('지출 합계(2)',tot.expense,BG.sum);
  const I=tot.income,E=tot.expense,R={a:I.a-E.a,b:I.b-E.b,c:I.c-E.c};foot('잔액(1-2) — 다음년도 이월액',R,BG.rem);
  const qlabel=qs.length===4?'1~4분기 (연간)':qs.map(q=>q+'분기').join('·')+' 누계';
  return {title:`${y}년도 수입, 지출 결산보고서`,sheet:`${y}년도 수지결산`,sub:`소망교회 청년회 (${deptLabel()})\n(${y}년 ${qlabel}) (단위: 원)`,land:true,fitH:true,sign:slotsFor('settlement',S.rd?+S.rd:null).map(s=>({label:s.label,signer:s.signer,img:s.sign_img})),
   widths:[7,18,24,13,13,13,13,13,10],
   head:[[TH('구분',{rs:2}),TH('항(대분류)',{rs:2}),TH('목(소분류)',{rs:2}),TH(`${y-1}년\n금액(A)`,{rs:2}),TH(`${y}년도`,{cs:2,bg:'#E8EEF8'}),TH('증감',{cs:2,bg:'#FEF9E6'}),TH('비고',{rs:2})],[TH('예산액(B)',{bg:'#E8EEF8'}),TH('금액(C)',{bg:'#E8EEF8'}),TH('전년대비\n(C-A)',{bg:'#FEF9E6'}),TH('예산대비\n(B-C)',{bg:'#FEF9E6'})]],
   body,notes:['1. 연간 예산 범위 내에서 절감 운용되어야 하며 부득이 예산 초과시에는 절차에 의한 추가예산 배정을 받아야 합니다.','2. 비용집행에 따른 증빙처리(6하원칙)를 잘해주시기 바랍니다.']};
}
